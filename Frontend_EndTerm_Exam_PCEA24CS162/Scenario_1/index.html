<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>Travel Gallery</h1>

  <div class="gallery">
    <div class="tile" style="background: linear-gradient(135deg, #2ecc71, #1e6091);">Mountain</div>
    <div class="tile" style="background: linear-gradient(135deg, #48cae4, #4361ee);">Beach</div>
    <div class="tile" style="background: linear-gradient(135deg, #52b788, #95d5b2);">Forest</div>
    <div class="tile" style="background: linear-gradient(135deg, #f77f00, #fcbf49);">Desert</div>
    <div class="tile" style="background: linear-gradient(135deg, #5e548e, #3a5a98);">City</div>
    <div class="tile" style="background: linear-gradient(135deg, #00b4d8, #0077b6);">Lake</div>
  </div>

  <div id="lightbox" class="lightbox hidden">
    <span id="closeBtn" class="close-btn">&times;</span>
    <div id="bigTile" class="big-tile"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
